# Apply on the k3s server (vm5) after the cluster is up and vm7 is cordoned:
#
#   sudo k3s kubectl apply -f /home/lab/lab.yml
#
# 2 web + 2 api. hostNetwork binds node :80 / :8080 so vm4 nginx can
# reach them. Nested Docker + nftables breaks CNI hostPort, so this
# file does not set hostPort/container ports. Recreate + anti-affinity
# => one pair per busy node. vm7 stays empty while cordoned.
# Web calls the API on the same node (127.0.0.1:8080).

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: api
              topologyKey: kubernetes.io/hostname
      containers:
        - name: api
          image: ghcr.io/ajadversalo/docker-lab-k8s/api:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: INSTANCE
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: api
spec:
  selector:
    app: api
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app: web
              topologyKey: kubernetes.io/hostname
      containers:
        - name: web
          image: ghcr.io/ajadversalo/docker-lab-k8s/web:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: PORT
              value: "80"
            - name: HOSTNAME
              value: "0.0.0.0"
            - name: SITE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: API_URL
              value: http://127.0.0.1:8080
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector:
    app: web
  ports:
    - port: 80
      targetPort: 80
