# Lesson 2 — build images, push to GHCR, roll them onto vm5
# Concepts: matrix / permissions / GITHUB_TOKEN / docker/build-push-action /
#           needs / self-hosted runner
#
# GitHub-hosted ubuntu-latest cannot reach vm5 (Docker Desktop on this PC).
# The deploy job runs on a self-hosted runner labeled docker-lab-k8s.

name: images

on:
  push:
    branches: [main]
    paths:
      - Api1/**
      - Web1/**
      - .github/workflows/images.yml
  pull_request:
    paths:
      - Api1/**
      - Web1/**
      - .github/workflows/images.yml
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./Api1
          - name: web
            context: ./Web1
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Image names and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      # GITHUB_TOKEN can push to ghcr.io/<owner>/<repo>/...
      # Skip login on pull_request — PRs only prove the image builds.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: deploy to lab vms
    needs: docker
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, docker-lab-k8s]
    steps:
      - uses: actions/checkout@v5

      - name: Apply images on vm5
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "sha-" + "${{ github.sha }}".Substring(0, 7)
          $repo = "${{ github.repository }}".ToLower()
          $api = "ghcr.io/$repo/api:$tag"
          $web = "ghcr.io/$repo/web:$tag"
          Write-Host "Deploying $api and $web"

          docker inspect -f "{{.State.Running}}" vm5 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "vm5 is not running" }

          $raw = Get-Content -Path "k8s/lab.yml" -Raw
          $raw = [regex]::Replace($raw, "image:\s+ghcr\.io/\S+/api:\S+", "image: $api")
          $raw = [regex]::Replace($raw, "image:\s+ghcr\.io/\S+/web:\S+", "image: $web")
          $staged = Join-Path $env:TEMP "docker-lab-k8s-lab.yml"
          $utf8 = New-Object System.Text.UTF8Encoding $false
          [System.IO.File]::WriteAllText($staged, $raw, $utf8)

          docker cp $staged vm5:/home/lab/lab.yml
          if ($LASTEXITCODE -ne 0) { throw "docker cp to vm5 failed" }

          docker exec vm5 sudo chown lab:lab /home/lab/lab.yml
          if ($LASTEXITCODE -ne 0) { throw "chown failed" }
          docker exec vm5 sudo k3s kubectl apply -f /home/lab/lab.yml
          if ($LASTEXITCODE -ne 0) { throw "kubectl apply failed" }
          docker exec vm5 sudo k3s kubectl rollout status deployment/api --timeout=360s
          if ($LASTEXITCODE -ne 0) { throw "api rollout failed" }
          docker exec vm5 sudo k3s kubectl rollout status deployment/web --timeout=360s
          if ($LASTEXITCODE -ne 0) { throw "web rollout failed" }
          docker exec vm5 sudo k3s kubectl get pods -o wide
          docker exec vm5 sudo k3s kubectl get deploy
