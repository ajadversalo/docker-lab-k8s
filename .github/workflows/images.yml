# Lesson 2 — build images and push to GHCR
# Concepts: matrix / permissions / GITHUB_TOKEN / docker/build-push-action /
#           build on PR, push only from main
#
# Images land at:
#   ghcr.io/ajadversalo/docker-lab-k8s/api
#   ghcr.io/ajadversalo/docker-lab-k8s/web
#
# k8s/lab.yml still pulls ghcr.io/ajadversalo/docker-lab/{api,web}:latest
# (the Swarm sibling). Point lab.yml at these tags when you want this repo
# to feed the cluster.

name: images

on:
  push:
    branches: [main]
    paths:
      - Api1/**
      - Web1/**
      - .github/workflows/images.yml
  pull_request:
    paths:
      - Api1/**
      - Web1/**
      - .github/workflows/images.yml
  workflow_dispatch:

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  docker:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: ./Api1
          - name: web
            context: ./Web1
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Image names and tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # GITHUB_TOKEN can push to ghcr.io/<owner>/<repo>/...
      # Skip login on pull_request — PRs only prove the image builds.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build (and push on main)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
